  <path d="M50 5 L50 25 M10 25 L30 35 M90 25 L70 35 M10 75 L30 65 M90 75 L70 65 M50 95 L50 75" stroke="#00d4ff" stroke-width="2" stroke-opacity="0.5" fill="none"/>

  <!-- Lock Body -->
